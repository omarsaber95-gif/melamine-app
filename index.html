<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المنار - حل مشكلة الدخول</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --primary: #1e3a8a; --bg: #f8fafc; }
        body { font-family: system-ui, sans-serif; background: var(--bg); direction: rtl; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .error-msg { color: red; background: #fee2e2; padding: 10px; border-radius: 5px; margin-top: 10px; display: none; font-size: 13px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .tab-btn { padding: 10px; background: #e2e8f0; border-radius: 8px; border: none; cursor: pointer; display: none; }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 12px; }
        .active { display: block !important; }
    </style>
</head>
<body>

<div id="loginSection" class="card">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="userInput" placeholder="اسم المستخدم (مثال: admin)">
    <input type="password" id="passInput" placeholder="كلمة المرور">
    <button onclick="handleLogin()">دخول 🔑</button>
    <div id="loginError" class="error-msg"></div>
</div>

<div id="appSection" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3 id="welcomeMsg">مرحباً</h3>
        <button onclick="auth.signOut()" style="width:auto; padding:5px 15px; background:red;">خروج</button>
    </div>

    <div class="tabs">
        <button id="tabEntry" class="tab-btn" onclick="showTab('entry')">📝 إدخال</button>
        <button id="tabHistory" class="tab-btn" onclick="showTab('history')">📊 سجلات</button>
        <button id="tabUsers" class="tab-btn" onclick="showTab('users')">👥 صلاحيات</button>
    </div>

    <div id="entry" class="tab-content">
        <h3>صفحة الإدخال</h3>
        <p>تم تسجيل الدخول بنجاح! يمكنك البدء بالعمل.</p>
    </div>
    
    <div id="history" class="tab-content">
        <h3>السجلات</h3>
    </div>

    <div id="users" class="tab-content">
        <h3>إدارة المستخدمين</h3>
    </div>
</div>

<script>
    // ضع الـ Config الخاص بك هنا (تأكد أنه مطابق تماماً لبيانات Firebase لديك)
    const firebaseConfig = {
      apiKey: "AIzaSyCVgCIZmjFn7v_erTVe-XdRkD1efTRvDNk",
      authDomain: "almanar-industry.firebaseapp.com",
      projectId: "almanar-industry",
      storageBucket: "almanar-industry.firebasestorage.app",
      messagingSenderId: "113518445928",
      appId: "1:113518445928:web:d9d3e645cdbd157ea8c2dd"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // دالة تسجيل الدخول المحسنة
    async function handleLogin() {
        const user = document.getElementById('userInput').value.trim().toLowerCase();
        const pass = document.getElementById('passInput').value;
        const errDiv = document.getElementById('loginError');

        errDiv.style.display = 'none';

        if(!user || !pass) {
            errDiv.innerText = "يرجى كتابة الاسم وكلمة المرور";
            errDiv.style.display = 'block';
            return;
        }

        try {
            // محاولة تسجيل الدخول بإضافة الدومين تلقائياً
            const email = user + "@almanar.factory";
            await auth.signInWithEmailAndPassword(email, pass);
        } catch (error) {
            console.error(error);
            errDiv.style.display = 'block';
            // ترجمة الأخطاء لكي تفهم المشكلة
            if (error.code === 'auth/user-not-found') errDiv.innerText = "اسم المستخدم غير موجود";
            else if (error.code === 'auth/wrong-password') errDiv.innerText = "كلمة المرور خطأ";
            else if (error.code === 'auth/network-request-failed') errDiv.innerText = "خطأ في الاتصال بالإنترنت";
            else errDiv.innerText = "خطأ: " + error.message;
        }
    }

    // مراقبة حالة المستخدم
    auth.onAuthStateChanged((user) => {
        if (user) {
            const userName = user.email.split('@')[0];
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            document.getElementById('welcomeMsg').innerText = "مرحباً: " + userName;
            
            // تفعيل الصلاحيات
            if(userName === 'admin') {
                document.querySelectorAll('.tab-btn').forEach(b => b.style.display = 'block');
                showTab('entry');
            } else {
                // للمستخدمين العاديين، تظهر صفحة الإدخال فقط كمثال
                document.getElementById('tabEntry').style.display = 'block';
                showTab('entry');
            }
        } else {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('appSection').style.display = 'none';
        }
    });

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
