<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام جودة المنار للميلامين</title>
  
  <!-- مكتبات Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <!-- مكتبة تحويل البيانات لإكسيل -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background: #f4f6f8; direction: rtl; margin: 0; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 450px; margin: 20px auto; }
    h2 { color: #1e293b; text-align: center; margin-top: 0; margin-bottom: 20px; }
    label { font-weight: bold; color: #334155; display: block; margin-top: 12px; margin-bottom: 4px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 15px; background-color: #f8fafc; }
    button { width: 100%; padding: 14px; margin-top: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .save-btn { background: #2563eb; color: white; }
    .save-btn:hover { background: #1d4ed8; }
    .excel-btn { background: #16a34a; color: white; }
    .excel-btn:hover { background: #15803d; }
    .status { text-align: center; font-weight: bold; margin-top: 15px; color: #16a34a; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>تطبيق جودة المنار للميلامين</h2>
    
    <label>اسم المشرف:</label>
    <input type="text" id="inspectorName" placeholder="أدخل اسمك">
    
    <label>رقم الشفت / الماكينة:</label>
    <input type="text" id="shiftNo" placeholder="مثال: شفت أ - ماكينة 3">
    
    <label>حالة الجودة:</label>
    <select id="qualityStatus">
      <option value="مقبول">مطابق للمواصفات (مقبول)</option>
      <option value="هالك / مرفوض">هالك / مرفوض</option>
      <option value="يحتاج إعادة تشغيل">يحتاج إعادة تشغيل</option>
    </select>
    
    <label>ملاحظات:</label>
    <input type="text" id="notes" placeholder="أي ملاحظات إضافية">
    
    <button class="save-btn" onclick="saveData()">تسجيل التقرير في الداتابيز 💾</button>
    <button class="excel-btn" onclick="exportToExcel()">تحميل شيت إكسيل (Excel) 📊</button>
    
    <div id="statusMsg" class="status"></div>
  </div>

  <script>
    // 1. إعدادات Firebase الخاصة بمصنع المنار
    const firebaseConfig = {
      apiKey: "AIzaSyCVgCIZmjFn7v_erTVe-XdRkD1efTRvDNk",
      authDomain: "almanar-industry.firebaseapp.com",
      projectId: "almanar-industry",
      storageBucket: "almanar-industry.firebasestorage.app",
      messagingSenderId: "113518445928",
      appId: "1:113518445928:web:d9d3e645cdbd157ea8c2dd",
      measurementId: "G-LL2P27RD7X"
    };

    // 2. تهيئة الداتابيز
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 3. دالة حفظ البيانات
    function saveData() {
      const inspector = document.getElementById('inspectorName').value;
      const shift = document.getElementById('shiftNo').value;
      const status = document.getElementById('qualityStatus').value;
      const notes = document.getElementById('notes').value;
      const statusMsg = document.getElementById('statusMsg');

      if (!inspector || !shift) {
        alert('برجاء كتابة اسم المشرف ورقم الشفت/الماكينة');
        return;
      }

      db.collection("qc_reports").add({
        inspectorName: inspector,
        shiftNo: shift,
        qualityStatus: status,
        notes: notes,
        createdAt: new Date().toLocaleString('ar-EG')
      })
      .then(() => {
        statusMsg.innerText = "تم حفظ التقرير بنجاح في الداتابيز! ✅";
        document.getElementById('notes').value = '';
        setTimeout(() => { statusMsg.innerText = ''; }, 3000);
      })
      .catch((error) => {
        alert("حدث خطأ أثناء الحفظ: " + error.message);
      });
    }

    // 4. دالة تصدير الإكسيل
    function exportToExcel() {
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.innerText = "جاري تحضير ملف الإكسيل... ⏳";

      db.collection("qc_reports").get().then((querySnapshot) => {
        let reportsData = [];
        
        querySnapshot.forEach((doc) => {
          let data = doc.data();
          reportsData.push({
            "التاريخ والوقت": data.createdAt,
            "اسم المشرف": data.inspectorName,
            "الشفت / الماكينة": data.shiftNo,
            "حالة الجودة": data.qualityStatus,
            "الملاحظات": data.notes
          });
        });

        if(reportsData.length === 0) {
          alert("لا توجد تقارير مخزنة حتى الآن لتصديرها.");
          statusMsg.innerText = "";
          return;
        }

        const worksheet = XLSX.utils.json_to_sheet(reportsData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "تقارير الجودة");

        XLSX.writeFile(workbook, "تقارير_جودة_المنار.xlsx");
        statusMsg.innerText = "تم تحميل ملف الإكسيل بنجاح! 📊";
        setTimeout(() => { statusMsg.innerText = ''; }, 3000);
      });
    }
  </script>
</body>
</html>
