<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل ماكينات مصنع المنار</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #1e3a8a; --bg: #f8fafc; }
        body { font-family: system-ui, sans-serif; background: var(--bg); padding: 15px; direction: rtl; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; flex: 1; min-width: 150px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; }
        th { background: #f1f5f9; }
        button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; color: white; background: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h3>تسجيل ماكينة/مكبس جديد</h3>
        <div class="form-row">
            <input type="text" id="mName" placeholder="اسم الماكينة">
            <input type="text" id="mType" placeholder="النوع (مثال: مكبس هيدروليكي)">
        </div>
        <div class="form-row">
            <input type="number" id="mLen" placeholder="الطول (سم)">
            <input type="number" id="mWidth" placeholder="العرض (سم)">
            <input type="number" id="mHeight" placeholder="الارتفاع (سم)">
            <input type="text" id="mPower" placeholder="قوة الضغط (طن)">
        </div>
        <div class="form-row">
            <input type="number" id="mTemp" placeholder="درجة الحرارة المثالية (°C)">
            <input type="date" id="mService" placeholder="تاريخ آخر صيانة">
        </div>
        <button onclick="addMachine()">إضافة الماكينة للسجل الفني</button>
    </div>

    <div class="card">
        <h3>سجل الماكينات والمكابس</h3>
        <div style="overflow-x:auto;">
            <table id="machinesTable">
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>النوع</th>
                        <th>الأبعاد (ط×ع×ا)</th>
                        <th>القوة</th>
                        <th>الحرارة</th>
                        <th>آخر صيانة</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="machinesBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { /* استخدم إعدادات مشروعك السابقة هنا */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function addMachine() {
        const machine = {
            name: document.getElementById('mName').value,
            type: document.getElementById('mType').value,
            dim: `${document.getElementById('mLen').value}×${document.getElementById('mWidth').value}×${document.getElementById('mHeight').value}`,
            power: document.getElementById('mPower').value,
            temp: document.getElementById('mTemp').value,
            service: document.getElementById('mService').value
        };
        db.collection("machines_specs").add(machine).then(() => {
            alert("تم حفظ بيانات الماكينة!");
            location.reload();
        });
    }

    db.collection("machines_specs").onSnapshot(snapshot => {
        const body = document.getElementById('machinesBody');
        body.innerHTML = '';
        snapshot.forEach(doc => {
            const m = doc.data();
            body.innerHTML += `<tr>
                <td>${m.name}</td><td>${m.type}</td><td>${m.dim}</td>
                <td>${m.power} طن</td><td>${m.temp}°C</td><td>${m.service}</td>
                <td><button style="background:red" onclick="deleteMachine('${doc.id}')">حذف</button></td>
            </tr>`;
        });
    });

    function deleteMachine(id) { db.collection("machines_specs").doc(id).delete(); }
</script>

</body>
</html>
