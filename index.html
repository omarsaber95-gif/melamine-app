<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة إنتاج أطباق الميلامين - المنار</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root { --primary: #1e3a8a; --secondary: #0284c7; --success: #16a34a; --danger: #dc2626; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; direction: rtl; }
        .container { max-width: 1150px; margin: 0 auto; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .header { background: var(--primary); color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #e2e8f0; padding: 6px; border-radius: 10px; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; font-weight: bold; cursor: pointer; border-radius: 8px; }
        .tab-btn.active { background: white; color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .form-group-flex { flex: 1; min-width: 120px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button.btn-submit { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
        th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: center; }
        th { background: #f1f5f9; }
        .clickable { cursor: pointer; color: var(--secondary); text-decoration: underline; font-weight: bold; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; justify-content: center; align-items: center; padding: 10px; }
        .modal-box { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 650px; max-height: 90vh; overflow-y: auto; }
        .btn-del { background: var(--danger); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginSection" class="card">
        <h2>دخول نظام المنار</h2>
        <form onsubmit="handleLogin(event)">
            <input type="text" id="usernameInput" placeholder="اسم المستخدم" required style="margin-bottom:10px">
            <input type="password" id="loginPassword" placeholder="كلمة المرور" required style="margin-bottom:10px">
            <button type="submit" class="btn-submit">دخول</button>
        </form>
        <div id="loginError" style="color:red; margin-top:10px; display:none;"></div>
    </div>

    <div id="appSection" style="display: none;">
        <div class="header"><h1>نظام إدارة إنتاج الميلامين</h1><button class="btn-logout" onclick="auth.signOut()">خروج</button></div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('entryTab')">📝 الإنتاج</button>
            <button class="tab-btn" onclick="switchTab('historyTab')">📊 التقارير</button>
            <button class="tab-btn" onclick="switchTab('masterTab')">⚙️ السجل الفني</button>
            <button class="tab-btn" onclick="switchTab('usersTab')">👥 العمال</button>
        </div>

        <div id="entryTab" class="tab-content active">
            <!-- محتوى الإنتاج كما كان -->
        </div>
        <div id="historyTab" class="tab-content">
            <!-- محتوى التقارير كما كان -->
        </div>
        <div id="masterTab" class="tab-content">
            <!-- محتوى السجل الفني -->
        </div>
        <div id="usersTab" class="tab-content">
            <!-- محتوى إدارة المستخدمين -->
        </div>
    </div>
</div>

<!-- Modal تفاصيل المكبس -->
<div id="machineModal" class="modal">
    <div class="modal-box">
        <h3 id="modalMachineTitle"></h3>
        <div id="viewMode">
            <p id="mDetails"></p>
            <button onclick="toggleEdit(true)">تعديل البيانات</button>
        </div>
        <div id="editMode" style="display:none;">
            <input type="text" id="eName" placeholder="الاسم">
            <input type="text" id="eType" placeholder="النوع">
            <input type="text" id="ePower" placeholder="القوة">
            <input type="text" id="eDim" placeholder="الأبعاد (طول×عرض×ارتفاع)">
            <button onclick="saveEdit()">حفظ التعديلات</button>
        </div>
        <hr>
        <h4>سجل الصيانة</h4>
        <div id="maintenanceLog"></div>
        <input type="date" id="mDate">
        <input type="text" id="mBy" placeholder="القائم بالصيانة">
        <input type="text" id="mTypeS" placeholder="نوع الصيانة">
        <input type="text" id="mNote" placeholder="ملاحظات">
        <button onclick="addMaintenance()">إضافة صيانة</button>
        <button onclick="closeModal()">إغلاق</button>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCVgCIZmjFn7v_erTVe-XdRkD1efTRvDNk",
      projectId: "almanar-industry",
      authDomain: "almanar-industry.firebaseapp.com",
      storageBucket: "almanar-industry.firebasestorage.app",
      messagingSenderId: "113518445928",
      appId: "1:113518445928:web:d9d3e645cdbd157ea8c2dd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // الدالة المحدثة والمراجعة لإضافة مستخدم (تمنع خطأ الإيميل)
    function handleAddNewUser(e) {
        e.preventDefault();
        let rawInput = document.getElementById('newUsername').value.trim();
        const username = rawInput.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
        const pass = document.getElementById('newUserPass').value;
        const isWorker = document.getElementById('isWorker').checked;
        const isSupervisor = document.getElementById('isSupervisor').checked;

        if(!username || !pass) { alert("يرجى إدخال اسم مستخدم وكلمة مرور!"); return; }

        const perms = {
            entry: document.getElementById('p_entry').checked, 
            history: document.getElementById('p_history').checked,
            excel: document.getElementById('p_excel').checked, 
            master: document.getElementById('p_master').checked,
            users: document.getElementById('p_users').checked
        };

        const email = `${username}@almanar.factory`;
        const secondaryAppName = "SecondaryApp_" + Date.now();
        const secondaryApp = firebase.initializeApp(firebaseConfig, secondaryAppName);
        const secondaryAuth = firebase.auth(secondaryApp);

        secondaryAuth.createUserWithEmailAndPassword(email, pass)
            .then(() => {
                return db.collection("users_permissions").doc(username).set({ username, isWorker, isSupervisor, perms });
            })
            .then(() => {
                alert(`تم إنشاء حساب (${username}) بنجاح!`);
                secondaryAuth.signOut();
                secondaryApp.delete();
                loadUsersTable();
            })
            .catch((error) => {
                alert("خطأ: " + error.message);
                secondaryApp.delete();
            });
    }

    // باقي الدوال كما هي...
</script>
</body>
</html>
